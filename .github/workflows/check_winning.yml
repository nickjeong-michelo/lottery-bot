name: Check Winning
on:
  schedule:
    - cron: 0 13 * * 6 # every Saturday on 10:00 PM (KST)
  workflow_dispatch:

# actions: write — 마지막 단계에서 이 워크플로를 다시 활성화해 60일 비활동 자동 비활성화를 막는다
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: [ubuntu-24.04] # ubuntu-latest(26.04)에는 setup-python의 3.9 빌드가 없다
    name: Check Winning
    steps:  

      - uses: actions/checkout@v3    
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Run Scripts
        run: make check # or use 'make check_lotto' / 'make check_win720' for granular check
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check_winning.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}